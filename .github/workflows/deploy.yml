name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to the current SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.image_tag || github.ref }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/el-contable-api:${{ env.IMAGE_TAG }}
            ghcr.io/el-contable-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Debug SSH authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -vvv \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "whoami"

      - name: Deploy immutable SHA
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_GHCR_USERNAME: ${{ secrets.VPS_GHCR_USERNAME }}
          VPS_GHCR_TOKEN: ${{ secrets.VPS_GHCR_TOKEN }}
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/apps/el_contable' }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "set -e && \
             cd $DEPLOY_PATH && \
             git pull --ff-only origin main && \
             printf '%s' '$VPS_GHCR_TOKEN' | docker login ghcr.io -u '$VPS_GHCR_USERNAME' --password-stdin && \
             printf 'IMAGE_TAG=%s\n' '${IMAGE_TAG}' > .env.deploy && \
             docker compose -f compose.prod.yml --env-file .env.prod --env-file .env.deploy config && \
             docker compose -f compose.prod.yml --env-file .env.prod --env-file .env.deploy pull && \
             docker compose -f compose.prod.yml --env-file .env.prod --env-file .env.deploy up -d db && \
             docker compose -f compose.prod.yml --env-file .env.prod --env-file .env.deploy run --rm api alembic upgrade head && \
             docker compose -f compose.prod.yml --env-file .env.prod --env-file .env.deploy up -d --remove-orphans"
