services:
  db:
    image: postgres:16-alpine
    container_name: el_contable_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: el_contable
      POSTGRES_PASSWORD: el_contable
      POSTGRES_DB: el_contable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
